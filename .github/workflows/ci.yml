name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,examples]"
      - run: PYTHONPATH=src python validate_release.py --check-only
      - run: sha256sum -c MANIFEST_SHA256.txt
      - run: pytest -q
